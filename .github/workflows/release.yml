name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build · ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: evolith.exe
            asset_name: evolith-windows-x64.zip

          - os: macos-14
            target: aarch64-apple-darwin
            binary: evolith
            asset_name: evolith-macos-arm64.tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: evolith
            asset_name: evolith-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Write README.txt
        shell: bash
        run: |
          cat > README.txt <<'EOF'
          Evolith — Project Memory Doctor
          ================================

          Quick start
          -----------
          1. cd your-project
          2. evolith init
          3. evolith collect git
          4. evolith features rebuild
          5. evolith doctor

          Options
          -------
          evolith doctor --security    security-only scan
          evolith doctor --verbose     show raw metric numbers
          evolith doctor --json        machine-readable output

          Full docs: https://github.com/thulasiramk-2310/Evolith
          EOF

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}","README.txt" `
            -DestinationPath "${{ matrix.asset_name }}"

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" .
          tar -czf "${{ matrix.asset_name }}" \
            "${{ matrix.binary }}" \
            README.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify artifacts exist
        run: |
          ls -lh evolith-*.zip evolith-*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            evolith-windows-x64.zip
            evolith-macos-arm64.tar.gz
            evolith-linux-x64.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
