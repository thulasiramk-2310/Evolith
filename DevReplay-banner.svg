<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="45%" stop-color="#111B37"/>
      <stop offset="100%" stop-color="#0C2A3E"/>
    </linearGradient>
    <linearGradient id="title" x1="240" y1="120" x2="1360" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.12  0 1 0 0 0.23  0 0 1 0 0.42  0 0 0 0.9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="36" fill="url(#bg)"/>

  <circle cx="180" cy="100" r="110" fill="#38BDF8" fill-opacity="0.08"/>
  <circle cx="1450" cy="320" r="150" fill="#34D399" fill-opacity="0.07"/>
  <circle cx="1270" cy="100" r="90" fill="#A78BFA" fill-opacity="0.09"/>
  <circle cx="330" cy="320" r="120" fill="#F472B6" fill-opacity="0.05"/>

  <g filter="url(#glow)">
    <text x="800" y="165" text-anchor="middle" fill="url(#title)"
          font-size="88" font-weight="800"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          letter-spacing="2">DevReplay</text>
  </g>

  <text x="800" y="232" text-anchor="middle"
        fill="#E5EEF8" opacity="0.95"
        font-size="28" font-weight="600"
        font-family="Inter, Segoe UI, Arial, sans-serif">
    Git tells you what changed. DevReplay tells you how it happened.
  </text>

  <g filter="url(#softShadow)">
    <rect x="420" y="285" width="760" height="70" rx="18" fill="#0F172A" fill-opacity="0.72" stroke="#334155"/>
  </g>

  <text x="800" y="330" text-anchor="middle"
        fill="#C7D2FE"
        font-size="24" font-weight="600"
        font-family="Consolas, SFMono-Regular, Menlo, Monaco, monospace">
    Event → Session → Feature → Story
  </text>

  <text x="800" y="380" text-anchor="middle"
        fill="#94A3B8"
        font-size="18" font-weight="500"
        font-family="Inter, Segoe UI, Arial, sans-serif">
    Open-source feature reconstruction engine for developer activity
  </text>
</svg>
