<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Evolith animated input output flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#bg)"/>

  <text x="40" y="52" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Evolith I/O Pipeline</text>
  <text x="40" y="82" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14">Input signals -> deterministic reconstruction -> trustable output</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d1d5db">
    <rect x="40" y="130" width="170" height="86" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="56" y="160" font-weight="700">Input</text>
    <text x="56" y="182">Git commits</text>
    <text x="56" y="202">Branches / PR refs</text>

    <rect x="260" y="130" width="190" height="86" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="276" y="160" font-weight="700">Extract</text>
    <text x="276" y="182">Anchors + episodes</text>
    <text x="276" y="202">Pattern signals</text>

    <rect x="500" y="130" width="190" height="86" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="516" y="160" font-weight="700">Reconstruct</text>
    <text x="516" y="182">Feature candidates</text>
    <text x="516" y="202">Assignment graph</text>

    <rect x="740" y="130" width="190" height="86" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="756" y="160" font-weight="700">Evaluate</text>
    <text x="756" y="182">Coverage + health</text>
    <text x="756" y="202">Confidence metrics</text>

    <rect x="980" y="130" width="180" height="86" rx="12" fill="#1f2937" stroke="#374151"/>
    <text x="996" y="160" font-weight="700">Output</text>
    <text x="996" y="182">runs show</text>
    <text x="996" y="202">features explain</text>
  </g>

  <path d="M210 173 L260 173" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M450 173 L500 173" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M690 173 L740 173" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M930 173 L980 173" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <g fill="#22d3ee" filter="url(#glow)">
    <circle r="6">
      <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"
        path="M210 173 L1160 173"/>
    </circle>
  </g>

  <g fill="none" stroke="#22c55e" stroke-width="2" opacity="0.75">
    <circle cx="125" cy="244" r="8">
      <animate attributeName="r" values="8;16;8" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="355" cy="244" r="8">
      <animate attributeName="r" values="8;16;8" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="595" cy="244" r="8">
      <animate attributeName="r" values="8;16;8" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="835" cy="244" r="8">
      <animate attributeName="r" values="8;16;8" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="244" r="8">
      <animate attributeName="r" values="8;16;8" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="40" y="314" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="13">Deterministic, explainable, local-first. No black-box AI required for core reconstruction.</text>
</svg>
